[package]
name    = "throttle-net"
version = "2.0.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "General-purpose outbound throttling and resilience for Rust: multi-algorithm rate limiting, multi-dimensional and cost-aware limits, adaptive throttling, circuit breakers, and jittered backoff/retry. The outbound companion to rate-net."

# Keywords (5 max)
keywords = [
    "rate-limiting",
    "throttling",
    "circuit-breaker",
    "retry",
    "backoff"
]

# Categories
categories = [
    "asynchronous",
    "network-programming",
    "concurrency"
]

# Links
homepage      = "https://github.com/jamesgober/throttle-net"
repository    = "https://github.com/jamesgober/throttle-net"
documentation = "https://docs.rs/throttle-net"

# Authors
authors = [
    "James Gober <me@jamesgober.com>"
]

# Packaging: the engineering standard and CI configuration are repository
# material, not part of the published crate.
exclude = [
    "REPS.md",
    ".github/",
    ".dev/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "throttle_net"
path = "src/lib.rs"


# LINTS
# #################################
# `throttle_loom` is a build-time cfg toggled via `RUSTFLAGS="--cfg throttle_loom"`
# for the concurrency model check (crate-private so it does not switch on the
# `cfg(loom)` paths in transitive deps); `docsrs` is set by docs.rs. Registering
# them keeps `unexpected_cfgs` quiet under `-D warnings`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(throttle_loom)',
    'cfg(docsrs)',
] }


# FEATURE FLAGS
# #################################
[features]
default = ["std", "tokio"]
# Standard library. Gates the limiter surface: the token-bucket accounting
# (`better-bucket`), the injectable clock (`clock-lib`), the domain error type
# (`error-forge`), and the per-key store (`ahash`, `hashbrown`). With std off the
# crate is `no_std` and exposes the pure algorithm core: `Backoff`,
# `BackoffIter`, `Jitter`, `Decision`, and `VERSION`.
std = [
    "dep:better-bucket",
    "better-bucket/clock",
    "dep:clock-lib",
    "clock-lib/std",
    "dep:error-forge",
    "dep:ahash",
    "dep:hashbrown",
]
# Internal marker: an async runtime backend is selected, so the waiting
# `acquire` surface (and the queue) is available. Enabled by `tokio` / `smol`;
# not meant to be turned on directly. Pulls the runtime-agnostic notification
# primitive (`event-listener`); the few future combinators the waits need
# (racing two futures, a cooperative yield) are a dozen lines in `rt.rs`.
runtime = ["std", "dep:event-listener"]
# Tokio async runtime integration (default): drives the waiting `acquire` timer
# and provides `TokioClock`, a clock that follows tokio's (pausable) time.
tokio = ["runtime", "dep:tokio"]
# smol async runtime integration: an alternative timer backend for the waiting
# `acquire` surface. (async-std is intentionally unsupported: it is
# discontinued, RUSTSEC-2025-0052.)
smol = ["runtime", "dep:async-io"]
# AIMD + latency-based adaptive limiters. The synchronous surface needs only
# `std`; the waiting `acquire` additionally needs a runtime (`tokio` / `smol`).
adaptive = ["std", "dep:event-listener"]
# Circuit breaker state machine. Requires the limiter surface (std).
circuit-breaker = ["std"]
# HTTP rate-limit header parsing and limiter reconciliation. Requires the
# limiter surface (std).
provider-headers = ["std"]
# LLM provider presets (Anthropic, OpenAI, ...).
provider-llm = ["provider-headers"]
# Metrics counters, gauges, and histograms through the `metrics` facade.
metrics = ["dep:metrics"]
# Tracing events around acquisitions and state transitions.
tracing = ["dep:tracing"]
# `tower::Layer` / `Service` adapters (rate limit, circuit breaker, adaptive
# concurrency). Needs an async runtime for the waiting acquire.
tower = ["runtime", "dep:tower-layer", "dep:tower-service"]


# DEPENDENCIES
# #################################
[dependencies]
# Token-bucket accounting (the single source of truth; never re-implemented).
# Its `clock` feature exposes the `Bucket` surface; `BucketCore` (caller-supplied
# time) backs the per-key store. 1.1 is the floor: 1.0 over-granted under
# thread contention (a stale clock reading refilled the bucket) and clamped
# capacities above ~4.29 M tokens.
better-bucket = { version = "1.1", default-features = false, optional = true }
# Monotonic, mockable time: the clock every limiter reads, injected so tests can
# substitute a `ManualClock`. 1.1 is the floor for `From<Instant> for Monotonic`
# (behind `TokioClock`) and the `ManualClock::advance` overflow fix.
clock-lib     = { version = "1.1", default-features = false, optional = true }
# Domain error type metadata (kind/retryability), shared across the portfolio
# stack instead of thiserror/anyhow in a library crate. 1.0.2 drops its unused
# thiserror/syn build dependencies.
error-forge   = { version = "1.0.2", optional = true }
# Fast, DoS-resistant hashing for the per-key store (~9% faster per-key
# lookups than std's SipHash on u64 keys, more on strings). No default
# features: each store is keyed from std's OS-seeded `RandomState`, so ahash's
# `getrandom` dependency is not needed. 0.8.11 is the floor that builds on
# current nightlies (older releases enable the removed `stdsimd` feature).
ahash         = { version = "0.8.11", default-features = false, optional = true }
# The per-key store's index: a `HashTable` of slot positions, so each key is
# hashed once and stored once, and eviction is an O(1) swap-remove. No default
# features: the store brings its own (ahash) hasher.
hashbrown     = { version = "0.17", default-features = false, features = ["inline-more"], optional = true }
# Runtime-agnostic notification primitive: the queue, the adaptive limiter, and
# the bulkhead wait on an `Event` rather than a tokio-specific `Notify`, so the
# same code runs on any executor. 5.4.2 is the floor for RUSTSEC-2026-0221
# (throttle-net never used the affected `listener!`/`with_tag` path).
event-listener = { version = "5.4.2", default-features = false, optional = true }
# Tokio timer backend for the waiting `acquire` surface (only the timer is used).
tokio   = { version = "1", optional = true, default-features = false, features = ["time"] }
# smol's timer backend for the waiting `acquire` surface: `async_io::Timer`,
# which `smol::Timer` re-exports, without the rest of smol (executor, fs, net,
# process). Timers created here are driven by smol's reactor.
async-io = { version = "2.3", optional = true }
# Metrics facade. 0.24 is the current major: one global recorder exists per
# major version, so the facade must match the application's.
metrics = { version = "0.24.6", optional = true }
# Structured events for acquisitions and state transitions.
tracing = { version = "0.1.40", optional = true, default-features = false, features = ["std"] }
# The `tower` integration: only the two trait crates, not tower itself.
tower-layer   = { version = "0.3.3", optional = true }
tower-service = { version = "0.3.3", optional = true }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
tokio     = { version = "1", features = ["full", "test-util"] }
# Comparative baseline for the benchmarks only (not a runtime dependency).
governor  = "0.10"
# `ServiceExt` for exercising the tower adapters in tests.
tower     = { version = "0.5", default-features = false, features = ["util"] }

# `loom` is a regular dependency (not dev) because the library's `sync` module
# imports it under `--cfg throttle_loom`; the cfg is only ever set for the model
# check, so normal builds never pull it.
[target.'cfg(throttle_loom)'.dependencies]
loom = "0.7"


# EXAMPLES
# #################################
# The waiting acquire surface needs the tokio timer.
[[example]]
name              = "llm_budget"
required-features = ["tokio"]

[[example]]
name              = "retry_backoff"
required-features = ["tokio"]

[[example]]
name              = "circuit_breaker"
required-features = ["circuit-breaker", "tokio"]

[[example]]
name              = "adaptive_concurrency"
required-features = ["adaptive", "tokio"]

[[example]]
name              = "per_tenant_quotas"
required-features = ["tokio"]

[[example]]
name              = "provider_sync"
required-features = ["provider-llm", "tokio"]

[[example]]
name              = "resilience_stack"
required-features = ["circuit-breaker", "tokio"]


# BENCHMARKS
# #################################
[[bench]]
name    = "throttle_bench"
harness = false

# Comparative throughput against `governor` (uncontended single-acquire floor).
[[bench]]
name    = "comparison_bench"
harness = false

# Throughput under contention at 1 / 4 / 16 / 64 concurrent acquirers.
[[bench]]
name    = "contention_bench"
harness = false

# Adversarial per-key floods: the cost of a new key once the store is full.
[[bench]]
name    = "eviction_bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
