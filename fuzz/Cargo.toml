# cargo-fuzz target crate for throttle-net: the byte-facing parsers and a
# state-machine target for the throttle and backoff arithmetic.
#
# Run locally (needs nightly + cargo-fuzz):
#   cargo +nightly fuzz run retry_after seeds/retry_after
#   cargo +nightly fuzz run provider_headers seeds/provider_headers
#   cargo +nightly fuzz run limiter_ops seeds/limiter_ops
#
# Seed inputs are committed under seeds/; the working corpus/ is not.
# CI runs each target for a fixed time budget as a smoke check.
[package]
name    = "throttle-net-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary     = { version = "1", features = ["derive"] }

[dependencies.throttle-net]
path     = ".."
features = ["provider-headers"]

# Keep the fuzz crate out of any parent workspace.
[workspace]

[profile.release]
debug = 1

[[bin]]
name    = "retry_after"
path    = "fuzz_targets/retry_after.rs"
test    = false
doc     = false
bench   = false

[[bin]]
name    = "provider_headers"
path    = "fuzz_targets/provider_headers.rs"
test    = false
doc     = false
bench   = false

[[bin]]
name    = "limiter_ops"
path    = "fuzz_targets/limiter_ops.rs"
test    = false
doc     = false
bench   = false
