name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  features:
    name: Features (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features std"
          - "--no-default-features --features tokio"
          - "--no-default-features --features smol"
          - "--no-default-features --features adaptive"
          - "--no-default-features --features circuit-breaker"
          - "--no-default-features --features provider-headers"
          - "--no-default-features --features provider-llm"
          - "--no-default-features --features metrics"
          - "--no-default-features --features tracing"
          - "--no-default-features --features std,metrics,tracing"
          - "--no-default-features --features tokio,tower"
          - "--no-default-features --features smol,adaptive,circuit-breaker,provider-llm,tower"
          - ""
          - "--features metrics,tracing"
          - "--all-features"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache keys may not contain commas; the job index is unique per row.
          key: features-${{ strategy.job-index }}
      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
      - name: Test
        run: cargo test ${{ matrix.features }}

  no-std:
    name: no_std core (thumbv7em)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Build the no_std core for a bare-metal target
        run: cargo build --no-default-features --target thumbv7em-none-eabihf

  loom:
    name: Loom (concurrency model check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Loom
        run: cargo test --test loom_throttle --no-default-features --features adaptive --release
        env:
          RUSTFLAGS: "--cfg throttle_loom"
          LOOM_MAX_PREEMPTIONS: "3"

  stress:
    name: Stress (release, real clock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Multi-threaded over-admission tests, optimised
        run: cargo test --release --all-features --test stress

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # cargo-fuzz manages its own RUSTFLAGS (sanitizer instrumentation); clear
      # the workflow-wide `-D warnings` so it does not fight the fuzz build.
      # Pin the fuzz target to the gnu triple: the prebuilt cargo-fuzz binary is
      # musl-static, so it would otherwise default the fuzz target to musl, whose
      # std/core the nightly toolchain does not ship.
      - name: Fuzz parse_retry_after (30s)
        run: cargo +nightly fuzz run retry_after fuzz/seeds/retry_after --target x86_64-unknown-linux-gnu -- -max_total_time=30
        env:
          RUSTFLAGS: ""
      - name: Fuzz provider headers (30s)
        run: cargo +nightly fuzz run provider_headers fuzz/seeds/provider_headers --target x86_64-unknown-linux-gnu -- -max_total_time=30
        env:
          RUSTFLAGS: ""
      - name: Fuzz limiter operations (30s)
        run: cargo +nightly fuzz run limiter_ops fuzz/seeds/limiter_ops --target x86_64-unknown-linux-gnu -- -max_total_time=30
        env:
          RUSTFLAGS: ""

  minimal-versions:
    name: Minimal direct dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve every direct dependency to its declared floor
        run: cargo +nightly update -Z direct-minimal-versions
      - name: Check
        run: cargo check --all-features

  semver:
    name: SemVer (cargo-semver-checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage summary
        run: cargo llvm-cov --all-features --summary-only

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      # The lockfile is not committed (library crate), so audit what a fresh
      # resolution would pull today.
      - name: Fresh lockfile
        run: cargo generate-lockfile
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check
